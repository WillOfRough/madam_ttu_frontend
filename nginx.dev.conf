server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://dev-knotsandlinks-backend-265481232089.asia-northeast3.run.app;
        proxy_set_header Host dev-knotsandlinks-backend-265481232089.asia-northeast3.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;

        # 백엔드 쿠키 도메인을 프론트엔드 도메인으로 재작성
        proxy_cookie_domain dev-knotsandlinks-backend-265481232089.asia-northeast3.run.app $host;
        proxy_cookie_path / /;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
