<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OG 미리보기 테스트</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif; background: #f5f5f5; padding: 40px 20px; }
    h1 { text-align: center; color: #1A2B4B; margin-bottom: 8px; font-size: 1.4rem; }
    .subtitle { text-align: center; color: #888; margin-bottom: 40px; font-size: 0.9rem; }
    .previews { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; max-width: 1000px; margin: 0 auto; }
    .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); width: 380px; }
    .card-header { padding: 12px 16px; background: #f9f9f9; border-bottom: 1px solid #eee; }
    .card-header h3 { font-size: 0.85rem; color: #666; }
    .og-image { width: 100%; aspect-ratio: 1200/630; object-fit: cover; display: block; }
    .og-body { padding: 12px 16px; }
    .og-title { font-size: 0.95rem; font-weight: 600; color: #333; margin-bottom: 4px; line-height: 1.4; }
    .og-desc { font-size: 0.82rem; color: #888; line-height: 1.4; }
    .og-url { font-size: 0.72rem; color: #aaa; margin-top: 6px; }

    .kakao .og-body { background: #FEE500; }
    .kakao .og-title { color: #191919; }
    .kakao .og-desc { color: #555; }

    .imessage { border: 1px solid #ddd; }
    .imessage .og-body { background: #e9e9eb; border-radius: 0 0 12px 12px; }

    .note { text-align: center; margin-top: 32px; color: #999; font-size: 0.8rem; line-height: 1.6; }
    .note a { color: #1A2B4B; }
  </style>
</head>
<body>
  <h1>knotsandlinks OG 미리보기</h1>
  <p class="subtitle">카카오톡, iMessage, SNS 등에서 링크 공유 시 이렇게 보입니다</p>

  <div class="previews">
    <!-- 카카오톡 스타일 -->
    <div class="card kakao">
      <div class="card-header"><h3>카카오톡</h3></div>
      <img src="/og-image.png" class="og-image" alt="OG Preview" />
      <div class="og-body">
        <p class="og-title">knotsandlinks - 소중한 인연을 연결합니다</p>
        <p class="og-desc">당신만을 위한 특별한 소개팅이 준비되었어요</p>
      </div>
    </div>

    <!-- iMessage / 일반 SNS 스타일 -->
    <div class="card imessage">
      <div class="card-header"><h3>iMessage / SMS</h3></div>
      <img src="/og-image.png" class="og-image" alt="OG Preview" />
      <div class="og-body">
        <p class="og-title">knotsandlinks - 소중한 인연을 연결합니다</p>
        <p class="og-desc">당신만을 위한 특별한 소개팅이 준비되었어요</p>
        <p class="og-url">knotsandlinks.com</p>
      </div>
    </div>
  </div>

  <p class="note">
    실제 배포 후 <a href="https://developers.kakao.com/tool/clear/og" target="_blank">카카오 OG 캐시 초기화</a>에서
    URL을 입력하면 즉시 반영됩니다.
  </p>
</body>
</html>
